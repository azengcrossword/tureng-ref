<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EngTur Crossword</title>
<style>
  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #1a1a2e;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
  }
  .card {
    background: #16213e;
    border-radius: 16px;
    padding: 40px 30px;
    max-width: 400px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  h1 { font-size: 22px; margin-bottom: 10px; }
  p { font-size: 16px; color: #ccc; line-height: 1.5; }
  .icon { font-size: 48px; margin-bottom: 16px; }
  .success { color: #4ade80; }
  .error { color: #f87171; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon" id="icon">⏳</div>
  <h1 id="title">Kontrol ediliyor...</h1>
  <p id="message">Lütfen bekleyin</p>
</div>

<script>
const SUPABASE_URL = "https://pgrzvysqzonlblpkhxwv.supabase.co";
const SUPABASE_KEY = "sb_publishable_bZexHhrkWnD7Gs63YlFL2Q_Mzy9TNKS";

const params = new URLSearchParams(window.location.search);
const token = params.get("t") || params.get("token");

const iconEl = document.getElementById("icon");
const titleEl = document.getElementById("title");
const messageEl = document.getElementById("message");

function showError(msg) {
  iconEl.textContent = "❌";
  iconEl.className = "icon error";
  titleEl.textContent = "Hata";
  messageEl.textContent = msg;
}

function showSuccess() {
  iconEl.textContent = "✅";
  iconEl.className = "icon success";
  titleEl.textContent = "Teşekkürler!";
   messageEl.innerHTML = "Arkadaşının yeni seviyeleri açıldı. EngTur Crossword ile sen de İngilizce öğrenmeye başla!<br><br><a href='https://play.google.com/store/apps/details?id=com.learnapplanguage.tureng' style='display:inline-block;padding:14px 28px;background:#34a853;color:#fff;font-size:18px;font-weight:bold;border-radius:12px;text-decoration:none'>Oyunu indir</a>";
}

async function processToken() {
  if (!token) {
    showError("Bağlantıda kod bulunamadı.");
    return;
  }

  try {
    const checkRes = await fetch(
      `${SUPABASE_URL}/rest/v1/share_tokens?token=eq.${encodeURIComponent(token)}&used=eq.false`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );
    const rows = await checkRes.json();

    if (!rows || rows.length === 0) {
      showError("Bu bağlantı geçersiz veya daha önce kullanılmış.");
      return;
    }

    const patchRes = await fetch(
      `${SUPABASE_URL}/rest/v1/share_tokens?token=eq.${encodeURIComponent(token)}`,
      {
        method: "PATCH",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({ used: true })
      }
    );

    if (patchRes.ok) {
      showSuccess();
    } else {
      showError("Onaylanamadı. Lütfen tekrar deneyin.");
    }
  } catch (e) {
    showError("Bağlantı hatası. İnternetinizi kontrol edin.");
  }
}

processToken();
</script>
</body>
</html>
